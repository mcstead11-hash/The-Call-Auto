name: Replay test (temporary)
on:
  push:
    branches: [auto-pipeline]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: SAMPLES=4 python3 -m pipeline.run --league college-football --date 20261017 --dry-run --top 0 | grep -E '^---|"(meta|question|desc|favors|a|b)"' 
